name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "pati-patni-ki-ladai"
  ANDROID_HOME: "/usr/lib/android-sdk"
  ANDROID_SDK_ROOT: "/usr/lib/android-sdk"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:

      - name: Checkout project
        uses: actions/checkout@v4
        
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest"

      - name: Setup Godot
        run: |
          mkdir -p ~/.config/godot
          mkdir -p ~/.local/share/godot/export_templates

          cp /root/.config/godot/editor_settings-4.3.tres \
            ~/.config/godot/editor_settings-4.3.tres

          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

          sed -i 's|export/android/java_sdk_path = ".*"|export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"|g' \
            ~/.config/godot/editor_settings-4.3.tres

          sed -i 's|export/android/android_sdk_path = ".*"|export/android/android_sdk_path = "/usr/lib/android-sdk"|g' \
            ~/.config/godot/editor_settings-4.3.tres

      - name: Create debug keystore
        run: |
          mkdir -p build/keystore

          keytool -genkeypair -v \
            -keystore build/keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
            
          cp build/keystore/debug.keystore android_debug.keystore
      - name: Check Android SDK and Java
        run: |
          java -version
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          echo "Android SDK and Java are ready."

      - name: Check project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build/android

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/build/keystore/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          godot --headless --verbose \
            --path . \
            --export-debug "Android Debug" \
            "build/android/${EXPORT_NAME}.apk"

      - name: Check APK
        run: |
          ls -lh build/android
          test -f "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pati-patni-ki-ladai-APK
          path: build/android/*.apk
          if-no-files-found: error
