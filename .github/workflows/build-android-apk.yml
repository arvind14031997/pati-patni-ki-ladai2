name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "pati-patni-ki-ladai"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot

          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
            >> ~/.config/godot/editor_settings-4.3.tres

          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
            >> ~/.config/godot/editor_settings-4.3.tres

      - name: Check Android SDK and Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la /usr/lib/android-sdk
          ls -la /usr/lib/jvm/java-17-openjdk-amd64

      - name: Check project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build/android

          godot --headless --verbose \
            --path . \
            --export-release "Android Release" \
            "build/android/${EXPORT_NAME}.apk"

      - name: Check APK
        run: |
          ls -lh build/android
          test -f "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pati-patni-ki-ladai-APK
          path: build/android/*.apk
          if-no-files-found: error
