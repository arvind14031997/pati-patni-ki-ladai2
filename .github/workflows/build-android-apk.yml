name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "pati-patni-ki-ladai"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Check project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose \
            --path . \
            --export-release "Android Release" \
            "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pati-patni-ki-ladai-APK
          path: build/android/*.apk
          if-no-files-found: error
